# ==========================================================
# Nome exibido na aba "Actions" do GitHub
# ==========================================================
name: Pull request

# ==========================================================
# Eventos que disparam este workflow
# ==========================================================
on:
  # Sempre que um pull request for aberto, atualizado ou reaberto...
  pull_request:
    # ...tendo a branch develop como destino
    branches:
      - develop

# ==========================================================
# Lista de trabalhos
# ==========================================================
jobs:
  # Nome interno do trabalho
  pull-request:
    # Máquina virtual utilizada pelo GitHub
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Impede que duas execuções do mesmo pull request rodem ao mesmo tempo,
    # sem cancelar a execução de outros pull requests em paralelo.
    concurrency:
      group: pull-request-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # Lista de etapas executadas em sequência.
    steps:
      # ------------------------------------------------------
      # Faz o clone do repositório.
      # Equivalente ao comando:
      #
      # git clone ...
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------
      # Garante o ambiente Node.js limpo na máquina.
      # ------------------------------------------------------
      - name: Setup Node.js (NPM Registry Auth)
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # ------------------------------------------------------
      # Instala o Bun.
      # ------------------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Sempre utiliza a versão mais recente.
          bun-version: latest

      # ------------------------------------------------------
      # Instala todas as dependências.
      # O --frozen-lockfile garante que o bun.lock esteja
      # sincronizado com o package.json.
      # ------------------------------------------------------
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ------------------------------------------------------
      # Verifica vulnerabilidades.
      # ------------------------------------------------------
      - name: Security audit
        run: bun run all:audit

      # ------------------------------------------------------
      # Garante que nenhum pacote @types/* esteja listado
      # em "dependencies". Eles devem ficar apenas em
      # "devDependencies".
      # ------------------------------------------------------
      - name: Verify @types dependencies
        shell: bash
        run: |
          found=0

          while IFS= read -r file; do
            if jq -e '.dependencies // {} | keys[] | startswith("@types/")' "$file" > /dev/null; then
              echo "❌ $file possui @types em dependencies"
              jq '.dependencies' "$file"
              found=1
            fi
          done < <(find packages -name package.json)

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Erro: pacotes @types devem estar em devDependencies."
            exit 1
          fi

          echo "✅ Nenhum @types encontrado em dependencies."

      # ------------------------------------------------------
      # Verifica vulnerabilidades de código com o Biome.
      # ------------------------------------------------------
      - name: Biome check
        run: bun run biome:check:ci

      # ------------------------------------------------------
      # Compila todos os pacotes.
      # ------------------------------------------------------
      - name: Build packages
        run: bun run all:build

      # ------------------------------------------------------
      # Executa a verificação de tipos.
      # ------------------------------------------------------
      - name: Run typecheck
        run: bun run all:typecheck

      # ------------------------------------------------------
      # RichText's browser-mode tests (@arkyn/components) rodam
      # sob um Chromium real via Playwright. O binário do
      # navegador não vem com `bun install`/`playwright` (pacote
      # npm) - precisa ser baixado à parte antes dos testes.
      #
      # Usa `bunx` (não `npx`) para garantir que resolve o mesmo
      # `playwright` já instalado pelo workspace (evita qualquer
      # divergência de versão entre o binário do CLI e o pacote
      # usado em tempo de execução pelos testes). `--with-deps`
      # instala também as bibliotecas de sistema exigidas pelo
      # Chromium no runner Ubuntu, e ambos os alvos são listados
      # explicitamente para não depender do empacotamento padrão.
      #
      # O download do binário do CDN da Playwright já falhou de
      # forma intermitente aqui (arquivo baixado parcialmente/
      # ausente, só percebido depois, quando os testes tentam
      # abrir o browser). O comando é idempotente, então tentamos
      # de novo algumas vezes antes de desistir.
      # ------------------------------------------------------
      - name: Install Playwright Chromium browser
        working-directory: packages/components
        run: |
          for attempt in 1 2 3; do
            bunx playwright install --with-deps chromium chromium-headless-shell && exit 0
            echo "Playwright install failed (attempt $attempt/3), retrying..."
            sleep 10
          done
          exit 1

      # ------------------------------------------------------
      # Executa todos os testes.
      # Caso algum falhe, o workflow para aqui.
      # ------------------------------------------------------
      - name: Run tests
        run: bun run all:test

      # ------------------------------------------------------
      # apps/development consome @arkyn/components (workspace)
      # e serve como sandbox manual para os componentes. Sem
      # isso no CI, uma mudança incompatível com essa app só
      # seria percebida manualmente, depois do merge.
      # ------------------------------------------------------
      - name: Typecheck development app
        run: bun run development:typecheck

      - name: Build development app
        run: bun run development:build

  # ==========================================================
  # @arkyn/components declara suporte a React 18 e 19 via
  # peerDependencies, mas as devDependencies (e portanto os
  # testes acima) só exercitam a 19. Esta matriz reinstala
  # react/react-dom em cada versão suportada e roda a suíte de
  # novo, para que uma API exclusiva do React 19 não quebre
  # silenciosamente consumidores em React 18.
  # ==========================================================
  components-react-compat:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: pull-request-react-compat-${{ github.event.pull_request.number }}-${{ matrix.react-version }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        react-version: ["18", "19"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ------------------------------------------------------
      # @arkyn/components depende do dist/ compilado de
      # @arkyn/shared e @arkyn/templates (não do código-fonte).
      # ------------------------------------------------------
      - name: Build workspace dependencies
        run: bun run templates:build && bun run shared:build

      # ------------------------------------------------------
      # Sobrescreve react/react-dom (e seus @types) apenas em
      # @arkyn/components, só para esta execução do runner.
      # Nada aqui é commitado de volta ao repositório.
      # ------------------------------------------------------
      - name: Pin React ${{ matrix.react-version }}
        working-directory: packages/components
        run: |
          bun add --dev \
            react@${{ matrix.react-version }} \
            react-dom@${{ matrix.react-version }} \
            @types/react@${{ matrix.react-version }} \
            @types/react-dom@${{ matrix.react-version }}

      - name: Typecheck components against React ${{ matrix.react-version }}
        run: bun run components:typecheck

      # ------------------------------------------------------
      # Mesma necessidade do job "pull-request": os testes de
      # browser-mode do RichText exigem um Chromium real, que
      # não vem instalado por padrão.
      # ------------------------------------------------------
      - name: Install Playwright Chromium browser
        working-directory: packages/components
        run: |
          for attempt in 1 2 3; do
            bunx playwright install --with-deps chromium chromium-headless-shell && exit 0
            echo "Playwright install failed (attempt $attempt/3), retrying..."
            sleep 10
          done
          exit 1

      - name: Test components against React ${{ matrix.react-version }}
        run: bun run components:test

  # ==========================================================
  # Todos os pacotes declaram "engines.node": ">=18.0.0", mas
  # todo o pipeline acima roda via Bun, que nunca de fato
  # invoca o Node.js do sistema para nada além da autenticação
  # de publicação. Este job verifica o piso real em duas etapas:
  #
  # 1. Node 18 (o piso declarado): a toolchain de build/test
  #    (Vite 8, Vitest 4) exige Node >=20 e não roda em 18, então
  #    só é possível validar o que "engines.node" de fato promete
  #    a um consumidor, que o dist/ publicado carregue sem erro.
  # 2. Node 20 LTS (o piso mínimo que a própria toolchain suporta):
  #    aqui a suíte de testes completa roda sob o runtime Node
  #    real via npx (bunx sempre usaria o runtime do Bun,
  #    independente da versão do Node ativa).
  # ==========================================================
  node-engine-floor:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: pull-request-node-floor-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ------------------------------------------------------
      # O build em si roda via Bun (independente da versão do
      # Node do sistema); só a execução exercita o piso.
      # ------------------------------------------------------
      - name: Build packages
        run: bun run all:build

      - name: Setup Node.js 18 (declared floor)
        uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Smoke-test published dist/ on Node 18
        run: node .github/scripts/smoke-test-dist.mjs

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run full test suite on Node 20
        shell: bash
        run: |
          for pkg in components server shared templates; do
            echo "::group::@arkyn/$pkg on Node $(node --version)"
            (cd "packages/$pkg" && npx vitest --config vitest.config.ts --run)
            echo "::endgroup::"
          done